# Borrador de config/supuestos.yaml - Observatorio Ciudadano de Envigado (OCE)
# Generado por el Agente Analizador el 2026-11-09 (plan: outputs/indicadores/plan/plan_calculo.md).
# REGLA: ninguna opcion "defecto" es una decision de los docentes (Francisco Correa, Eber Gutierrez) ni de la usuaria.
# Todas estan en estado PROVISIONAL y deben rotularse asi en cada salida. Se calcula con todas las opciones.

version: "0.1-borrador"
fecha: "2026-11-09"
estado_global: PROVISIONAL
decide: "Docentes (F. Correa, E. Gutierrez) y usuaria"

estrategia_escenarios:
  indicador_simple: factorial_completo        # si > 100 combinaciones, un_factor_a_la_vez
  limite_factorial: 100
  indices: [defecto, un_factor_a_la_vez, envolvente_min, envolvente_max]
  formato_escenario_id: "defecto | param=opcion;param=opcion (solo desviaciones, orden alfabetico)"

convenciones:
