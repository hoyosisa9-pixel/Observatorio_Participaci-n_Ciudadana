# config/supuestos.yaml - Observatorio Ciudadano de Envigado (OCE)
# Generado a partir de outputs/indicadores/plan/supuestos_borrador.yaml (Analizador, 2026-11-09).
# Ningún valor por defecto es una decisión de los docentes: todos son PROVISIONAL y deben rotularse así en cada salida.
# Para cambiar un supuesto: editar 'defecto' (debe estar entre las 'opciones') y volver a ejecutar los scripts.
version: 1.0-provisional
fecha: '2026-11-09'
estado_global: PROVISIONAL
decide: Profesores Francisco Correa y Eber Gutiérrez, con la usuaria
